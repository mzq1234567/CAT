# CI/CD — every push to `feature` builds, tests, and deploys to the Azure App Service.
#
# Auth: the App Service publish profile, stored as the GitHub repository secret
# AZURE_WEBAPP_PUBLISH_PROFILE (Settings → Secrets and variables → Actions). Requires SCM basic-auth
# publishing to be enabled on the web app.
#
# What gets deployed is the REPO-ROOT layout (backend/ + frontend/dist/ + root requirements.txt shim);
# App Service's Oryx build installs the Python deps on its side (SCM_DO_BUILD_DURING_DEPLOYMENT=true)
# and `bash backend/startup.sh` starts uvicorn. See backend/startup.sh.
name: Deploy to Azure App Service

on:
  push:
    branches: [feature]
  workflow_dispatch:

# Never run two deploys of the same branch at once; queue the later one instead of cancelling.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: tpt-azure-cat
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Frontend ────────────────────────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, type-check, build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build

      # ── Backend ─────────────────────────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend — install + run tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -q

      # ── Package ─────────────────────────────────────────────────────────────────────────────────
      # Only what the server needs: no venv, tests, caches, local DB, .env or dev scripts.
      - name: Package deployment zip
        run: |
          zip -r deploy.zip requirements.txt backend frontend/dist \
            -x "backend/.venv/*" "backend/tests/*" "backend/scripts/*" \
               "*__pycache__*" "*.pytest_cache*" "*.pyc" "backend/*.db" "backend/.env" "backend/start.ps1"
          unzip -l deploy.zip | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: deploy.zip
          retention-days: 3

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip

      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health")
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "health check never returned 200" && exit 1
